<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quantas sentenças ler</title>
<!--
Calculadora do tamanho de amostra para estimar a taxa de acerto do modelo, do slide "Quantas
sentenças ler" da aula de LLM da Clínica II. Escrita à mão, sem passos, e por isso não fala com o
visualizador; as setas, fora dos campos, trocam de slide.

Conta: n0 = z² · p · (1 − p) / e², com a correção para população finita n = n0 / (1 + (n0 − 1) / N),
arredondada para cima. A margem obtida com n já lido usa a mesma aproximação normal ao contrário.
Os padrões são os da base de exemplo da aula: 20.013 textos distintos, 90% de acerto esperado, ±5 pontos, 95%.
-->
<style>
  :root {
    --fundo: #ffffff; --texto: #1a1a1a; --apagado: #555555; --vermelho: #c40000;
    --caixa: #f2f2f2; --borda: #8a8a8a; --foco: #1f4e9c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fundo); color: var(--texto); }
  body {
    font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
    font-size: clamp(16px, 2.3vw, 30px); line-height: 1.3;
    display: flex; flex-direction: column; justify-content: center; padding: 2vh 3vw;
  }
  h1 { font-size: 1.5em; margin: 0 0 0.6em; }
  body.embutido h1 { display: none; }
  .grade { display: grid; grid-template-columns: 1.15fr 1fr; gap: 2.5vw; align-items: center; }
  .campos { display: grid; gap: 0.55em; }
  label { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 0.2em 0.6em; }
  label span.valor { font-weight: 700; min-width: 4.5em; text-align: right; }
  input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--vermelho); height: 1.2em; }
  input[type=number] {
    font: inherit; width: 6.5em; padding: 0.1em 0.3em; border: 2px solid var(--borda); border-radius: 6px; text-align: right;
  }
  input:focus-visible, select:focus-visible { outline: 3px solid var(--foco); outline-offset: 2px; }
  select { font: inherit; padding: 0.1em 0.3em; border: 2px solid var(--borda); border-radius: 6px; background: #fff; }
  .resultado { background: var(--caixa); border-radius: 10px; padding: 0.8em 1em; }
  .resultado .rotulo { color: var(--apagado); font-size: 0.85em; }
  .resultado .numero { font-size: 3em; font-weight: 800; color: var(--vermelho); line-height: 1.05; }
  .resultado p { margin: 0.3em 0; }
  .nota { color: var(--apagado); font-size: 0.8em; margin-top: 0.8em; }
</style>
</head>
<body>
<h1>Quantas sentenças ler</h1>
<div class="grade">
  <div class="campos">
    <label>Sentenças na base <input type="number" id="base" min="1" step="1" value="20013"></label>
    <label for="margem">Margem de erro, ± <span class="valor" id="margem-valor"></span>
      <input type="range" id="margem" min="1" max="15" step="0.5" value="5"></label>
    <label for="acerto">Acerto que se espera do modelo <span class="valor" id="acerto-valor"></span>
      <input type="range" id="acerto" min="50" max="99" step="1" value="90"></label>
    <label>Confiança
      <select id="confianca">
        <option value="1.645">90%</option>
        <option value="1.96" selected>95%</option>
        <option value="2.576">99%</option>
      </select></label>
    <label>Minutos para ler uma sentença <input type="number" id="minutos" min="0" step="0.5" value="3"></label>
  </div>
  <div class="resultado" aria-live="polite">
    <div class="rotulo">sentenças para ler</div>
    <div class="numero" id="n">0</div>
    <p id="horas"></p>
    <p id="frase"></p>
  </div>
</div>
<p class="nota">Com 50% de acerto esperado a conta dá o maior número: é a escolha segura quando não se sabe quanto o modelo acerta.</p>
<script>
  if (window.self !== window.top) document.body.classList.add("embutido");
  const $ = (id) => document.getElementById(id);
  const numero = (x, casas = 0) => x.toLocaleString("pt-BR", {minimumFractionDigits: casas, maximumFractionDigits: casas});

  function tamanho(N, e, p, z) {
    const n0 = (z * z * p * (1 - p)) / (e * e);
    return Math.ceil(n0 / (1 + (n0 - 1) / N));
  }

  function atualizar() {
    const N = Math.max(1, Math.floor(Number($("base").value) || 1));
    const e = Number($("margem").value) / 100, p = Number($("acerto").value) / 100, z = Number($("confianca").value);
    const minutos = Math.max(0, Number($("minutos").value) || 0);
    $("margem-valor").textContent = numero(e * 100, e * 100 % 1 ? 1 : 0) + " pontos";
    $("acerto-valor").textContent = numero(p * 100) + "%";
    const n = Math.min(N, tamanho(N, e, p, z));
    $("n").textContent = numero(n);
    const horas = (n * minutos) / 60;
    $("horas").textContent = minutos ? `cerca de ${numero(horas, horas < 10 ? 1 : 0)} horas de leitura` : "";
    const confianca = $("confianca").selectedOptions[0].textContent;
    $("frase").textContent = `Com ${numero(n)} lidas, a taxa de acerto medida fica a ${numero(e * 100, e * 100 % 1 ? 1 : 0)} pontos da taxa da base inteira, em ${confianca} das amostras.`;
  }
  for (const id of ["base", "margem", "acerto", "confianca", "minutos"]) $(id).addEventListener("input", atualizar);
  atualizar();
</script>
</body>
</html>
